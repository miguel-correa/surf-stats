   services:
     # Backend - Go API server
     backend:
       build: ./backend
       container_name: surfstats-backend
       restart: unless-stopped
       ports:
         - "8080:8080"
       volumes:
         # Persist database outside container
         - ./backend/data:/app/data
       networks:
         - surfstats-network

     # Frontend - React app with nginx
     frontend:
       build: ./frontend
       container_name: surfstats-frontend
       restart: unless-stopped
       ports:
         - "80:80"
       depends_on:
         - backend
       networks:
         - surfstats-network

   networks:
     surfstats-network:
       driver: bridge